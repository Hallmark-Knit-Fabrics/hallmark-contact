<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#555f00">
  <meta name="description" content="Contact Hallmark Knit Fabrics for knitted fabric enquiries, product information and business opportunities.">
  <title>Contact Our Team | Hallmark Knit Fabrics</title>
  <style>
    :root{--olive:#555f00;--olive-dark:#4b5400;--olive-pale:#eff0df;--cream:#f8f7f0;--gold:#b5a34b;--border:#e2e0cf;--text:#26271f;--muted:#77786c;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
    .page{width:min(100%,900px);margin:0 auto;padding:18px}
    .intro{background:var(--olive-pale);border-radius:18px;text-align:center;padding:24px 20px 18px;margin-bottom:14px}
    .logo-wrap{width:250px;height:125px;margin:0 auto 17px;background:transparent;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;overflow:visible}
    .logo-wrap img{width:100%;height:100%;object-fit:contain;padding:0}
        .gold-line{height:2px;background:var(--gold);margin:0 0 17px}
    .intro h1{color:#3e4327;font-size:17px;margin:0 0 6px}
    .company{color:#6e6e60;font-size:13px;margin:0}
    .contacts{display:grid;gap:11px}
    .contact-row{min-height:72px;display:flex;align-items:center;gap:13px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:13px}
    .person-icon{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:var(--olive-pale);color:var(--olive);display:flex;align-items:center;justify-content:center}
    .person-icon svg,.action-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .person-details{flex:1;min-width:0}
    .person-details h2{margin:0 0 3px;font-size:14px;color:#22231d}
    .person-name{font-size:13px;color:#66675d;margin:0 0 2px}
    .phone-link{color:#77786c;font-size:12px;text-decoration:none}
    .phone-link:hover{color:var(--olive);text-decoration:underline}
    .row-actions{display:flex;align-items:center;gap:13px;padding-left:8px}
    .action-icon{color:var(--olive);width:24px;height:28px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    .action-icon:hover{color:#8a8d25}
    .linkedin{width:19px;height:19px;border:1.7px solid currentColor;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:700;font-family:Arial,sans-serif}
    .quick-links{background:var(--olive-dark);color:white;border-radius:13px;margin-top:12px;padding:13px 15px;display:grid;gap:10px}
    .quick-links a{color:white;text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:11px;overflow-wrap:anywhere}
    .quick-links a:hover{color:#f0e5b2}
    .quick-links svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    footer{color:#77786c;font-size:11px;text-align:center;padding:11px 0 0}
    @media(min-width:760px){.page{padding:24px}.intro{padding-top:28px}.contact-row{min-height:78px;padding:14px 17px}.person-details h2{font-size:15px}}
    @media(max-width:420px){.page{padding:12px}.intro{padding:20px 13px 16px}.logo-wrap{width:215px;height:108px;margin-bottom:15px}.contact-row{gap:10px;padding:11px}.person-icon{flex-basis:38px;width:38px;height:38px}.row-actions{gap:9px;padding-left:2px}.person-details h2{font-size:13px}.person-name{font-size:12px}}
  </style>
</head>
<body>

  <footer>Hallmark Knit Fabrics Pvt. Ltd.</footer>
</main>
</body>
</html>
